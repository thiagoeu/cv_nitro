<svg xmlns="http://www.w3.org/2000/svg" width="176" height="32" viewBox="0 0 176 32">
  <defs>
    <linearGradient id="nitro-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <!-- Símbolo / Marca GitMatch com gradiente ciano e verde-menta -->
  <rect width="32" height="32" rx="8" fill="url(#nitro-grad)"/>
  <circle cx="16" cy="16" r="9" fill="none" stroke="#FFFFFF" stroke-width="2.2"/>
  <circle cx="16" cy="16" r="4.2" fill="none" stroke="#FFFFFF" stroke-width="2.2"/>
  <circle cx="16" cy="16" r="1.4" fill="#FFFFFF"/>
  <!-- Tipografia do produto: Azul Noturno (#0F172A) em harmonia com a barra clara -->
  <text x="42" y="22" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0F172A" letter-spacing="-0.3">GitMatch</text>
  <!-- Badge NITRO com verde-menta de destaque (10%) -->
  <rect x="128" y="8" width="46" height="16" rx="8" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.7" stroke-width="1"/>
  <text x="151" y="19.5" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#10B981" letter-spacing="0.6">NITRO</text>
</svg>
