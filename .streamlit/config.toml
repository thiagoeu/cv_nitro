[client]
toolbarMode = "minimal"

# Design system do GitMatch / CV Nitro: Regra 60-30-10 (Paleta Clássico Tech Confiável)
# 60% Fundo Neutro: #F8FAFC (branco gelo) e #F1F5F9 (superfícies secundárias)
# 30% Estrutura e Identidade: #0F172A (azul noturno) e #CBD5E1 (divisórias/bordas)
# 10% Destaques e Ações: #10B981 (verde-menta) e #0EA5E9 (ciano complementar)
[theme]
base = "light"
primaryColor = "#10B981"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
borderColor = "#CBD5E1"
showWidgetBorder = true
linkColor = "#0EA5E9"
linkUnderline = false
codeBackgroundColor = "#F1F5F9"
dataframeHeaderBackgroundColor = "#F1F5F9"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFontWeights = [700, 650, 600, 600, 600, 600]
headingFontSizes = ["2.75rem", "2rem", "1.5rem", "1.15rem", "1rem", "0.875rem"]
baseRadius = "0.6rem"
buttonRadius = "0.6rem"
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#F1F5F9"
